<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perapi Dokumen — Tulung</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p><a href="../">&larr; Tulung</a></p>
      <h1>PERAPI DOKUMEN</h1>
      <p>Format makalah jadi rapi dalam sekali klik. Isi dokumen tidak berubah, hanya formatnya.</p>
    </header>

    <section class="section brutal-border">
      <label id="drop-area" class="drop-area" for="file-input">
        <span class="drop-title"><strong>Tambah dokumen</strong></span>
        <span class="brutal-border brutal-btn pick-btn">Pilih dokumen</span>
        <span class="drop-hint">File .docx saja.</span>
        <input id="file-input" class="visually-hidden" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
      </label>

      <div id="error" class="brutal-border" style="display:none; background:#ffcccc; padding:12px; margin-top:16px; font-weight:700;"></div>

      <div id="file-section" style="display:none; margin-top:24px;">
        <h2>DOKUMEN</h2>
        <p><strong id="file-name"></strong> <span id="file-size"></span></p>
        <p><button id="remove-file" class="brutal-border brutal-btn" style="padding:8px 14px; font-family:'Space Mono',monospace; font-weight:700; background:#e5e5e5;">Hapus dokumen</button></p>
      </div>

      <div id="preset-section" style="display:none; margin-top:24px;">
        <h2>PRESET</h2>
        <div class="option-group">
          <div class="option-buttons" data-option="preset">
            <button type="button" data-value="umum" class="brutal-border brutal-btn option-btn selected">Standar Umum<br><small>TNR 12 &middot; Spasi 1,5 &middot; Margin 4-3-3-3 cm</small></button>
            <button type="button" data-value="unpam" class="brutal-border brutal-btn option-btn">UNPAM<br><small>TNR 12 &middot; Spasi 1,5 &middot; Margin 4-3-3-4 cm</small></button>
          </div>
        </div>
      </div>

      <div id="scan-section" style="display:none; margin-top:24px;">
        <h2>HASIL PINDAI</h2>
        <div id="scan-summary"></div>
        <ul id="issue-list" style="margin-top:12px; padding-left:20px;"></ul>
      </div>
    </section>

    <section class="section brutal-border" style="text-align:center;">
      <button id="fix-btn" class="brutal-border brutal-btn convert-btn" disabled>PERBAIKI</button>
      <p id="loading" style="display:none; font-weight:700; margin-top:16px;">Memperbaiki dokumen...</p>
    </section>

    <section id="result-section" class="section brutal-border" style="display:none;">
      <h2>DOKUMEN SIAP</h2>
      <p class="result-row">
        <label style="font-weight:700;">Nama file:</label>
        <input id="filename" type="text" value="dokumen-rapi"> <strong>.docx</strong>
      </p>
      <p>
        <a id="download-link" class="brutal-border brutal-btn" style="display:inline-block; padding:10px 18px; background:#ff3366; color:#fff; font-weight:700; text-decoration:none;">Unduh .docx</a>
      </p>
      <p id="rescan-result" style="font-weight:700;"></p>
      <ul id="remaining-list" style="padding-left:20px;"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Tulung &middot; Lisensi MIT &middot; <a href="https://github.com/senshiner/tulung">GitHub</a></p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
