<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gambar ke PDF — Tulung</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p><a href="../">&larr; Tulung</a></p>
      <h1>GAMBAR &rarr; PDF</h1>
      <p>Susun foto dan catatan jadi satu PDF: atur urutan dan rotasi tiap gambar, pilih ukuran halaman dan margin.</p>
    </header>

    <section class="section brutal-border">
      <label id="drop-area" class="drop-area" for="file-input">
        <span class="drop-title"><strong>Tambah gambar</strong></span>
        <span class="brutal-border brutal-btn pick-btn">Pilih gambar</span>
        <span class="drop-hint">JPG, PNG, WebP, BMP, GIF.</span>
        <input id="file-input" class="visually-hidden" type="file" accept="image/*" multiple>
      </label>

      <div id="error" class="brutal-border" style="display:none; background:#ffcccc; padding:12px; margin-top:16px; font-weight:700;"></div>

      <div id="preview-section" style="display:none; margin-top:24px;">
        <h2>GAMBAR (<span id="count">0</span>)</h2>
        <div id="preview-grid" class="preview-grid"></div>
        <p style="margin-top:16px;">
          <button id="clear-all" class="brutal-border brutal-btn" style="padding:8px 14px; font-family:'Space Mono',monospace; font-weight:700; background:#e5e5e5;">Hapus semua</button>
          <span id="summary" style="font-weight:700; margin-left:12px;"></span>
        </p>
      </div>

      <div id="options-section" style="display:none; margin-top:24px;">
        <h2>OPSI</h2>
        <div class="option-group">
          <p class="option-label">Orientasi</p>
          <div class="option-buttons" data-option="orientation">
            <button type="button" data-value="portrait" class="brutal-border brutal-btn option-btn selected">Potret</button>
            <button type="button" data-value="landscape" class="brutal-border brutal-btn option-btn">Lanskap</button>
          </div>
        </div>
        <div class="option-group">
          <p class="option-label">Ukuran halaman</p>
          <div class="option-buttons" data-option="pageSize">
            <button type="button" data-value="a4" class="brutal-border brutal-btn option-btn selected">A4</button>
            <button type="button" data-value="letter" class="brutal-border brutal-btn option-btn">US Letter</button>
            <button type="button" data-value="fit" class="brutal-border brutal-btn option-btn">Sesuai gambar</button>
          </div>
        </div>
        <div class="option-group">
          <p class="option-label">Margin</p>
          <div class="option-buttons" data-option="margin">
            <button type="button" data-value="none" class="brutal-border brutal-btn option-btn selected">Tanpa margin</button>
            <button type="button" data-value="small" class="brutal-border brutal-btn option-btn">Kecil</button>
            <button type="button" data-value="big" class="brutal-border brutal-btn option-btn">Besar</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section brutal-border" style="text-align:center;">
      <button id="convert-btn" class="brutal-border brutal-btn convert-btn" disabled>BUAT PDF</button>
      <p id="loading" style="display:none; font-weight:700; margin-top:16px;">Membuat PDF...</p>
    </section>

    <section id="result-section" class="section brutal-border" style="display:none;">
      <h2>PDF SIAP</h2>
      <p class="result-row">
        <label style="font-weight:700;">Nama file:</label>
        <input id="filename" type="text" value="tulung-gambar-ke-pdf"> <strong>.pdf</strong>
      </p>
      <p>
        <a id="download-link" class="brutal-border brutal-btn" style="display:inline-block; padding:10px 18px; background:#ff3366; color:#fff; font-weight:700; text-decoration:none;">Unduh PDF</a>
      </p>
      <div style="overflow:auto; background:#f5f5f5; padding:16px;">
        <iframe id="pdf-preview" width="100%" style="border:2px solid #000;"></iframe>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Tulung &middot; Lisensi MIT &middot; <a href="https://github.com/senshiner/tulung">GitHub</a></p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
