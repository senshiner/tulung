[package]
name = "tulung-core"
version = "0.1.0"
edition = "2021"
description = "Mesin Tulung: logika tools (gambar ke PDF, perapi .docx, tulis tangan), dikompilasi ke WebAssembly."
license = "MIT"
repository = "https://github.com/senshiner/tulung"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
printpdf = { version = "0.8", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
rdocx = { version = "0.17", default-features = false, features = ["system-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bedah zip .docx untuk menyisip skeleton daftar isi (rdocx tidak
# membuka API tulis untuk itu). Fitur sama seperti yang dipakai
# oxml-opc, supaya build WASM tetap jalan.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
